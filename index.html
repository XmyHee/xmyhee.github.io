<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuestFrontiers | 求索映界</title>

    <!-- 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- 样式 -->
    <link rel="stylesheet" href="style.css">

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
</head>

<body>

<!-- ================= 导航栏（修复） ================= -->
<div class="global-nav">
    <div class="nav-inner">

        <!-- Logo -->
        <div class="logo" onclick="scrollToTop()">
            <img 
                src="logo.png"
                class="logo-img"
                alt="logo"
                decoding="async"
                fetchpriority="high"
            >
            <span class="logo-text">QuestFrontiers | 求索映界</span>
        </div>

        <!-- 导航 -->
        <div class="nav-icons">
            <div class="nav-item">
                <div class="icon">◎</div>
                <p>前沿疆域</p>
            </div>

            <div class="nav-item">
                <div class="icon">◉</div>
                <p>映照引擎</p>
            </div>

            <div class="nav-item">
                <div class="icon">⬡</div>
                <p>解决方案</p>
            </div>
        </div>

        <!-- 探索者模式 -->
        <div class="explorer-toggle" onclick="toggleExplorerMode()">
            <span class="toggle-label">探索者模式</span>
            <div class="toggle-switch">
                <div class="toggle-dot"></div>
            </div>
        </div>

    </div>
</div>

<!-- ================= 3D 背景 ================= -->
<div id="three-container"></div>

<!-- ================= Hero ================= -->
<section class="hero">

    <div class="energy-core"></div>

    <div class="hero-center">
        <h1>QuestFrontiers</h1>
        <p>探索智能 · 映照万象</p>
    </div>

</section>

<!-- ================= 节点信息面板 ================= -->
<div id="node-panel">
    <h3 id="node-title">AI Node</h3>
    <p id="node-desc">系统就绪</p>
    <button onclick="closePanel()">关闭</button>
</div>

<!-- ================= JS ================= -->
<script src="script.js"></script>

</body>
</html>
