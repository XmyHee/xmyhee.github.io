<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  
  <!-- 更合理的 viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>QuestFrontiers | 求索映界</title>

  <!-- SEO -->
  <meta name="description" content="QuestFrontiers - AI探索与映射平台" />

  <!-- 预加载关键资源 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <!-- 字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- 样式 -->
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js（非阻塞） -->
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

  <!-- 主逻辑（模块化） -->
  <script defer type="module" src="script.js"></script>
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="global-nav">
  <div class="nav-inner">

    <!-- Logo -->
    <button class="logo" id="logoBtn">
      <img src="logo.png" alt="QuestFrontiers Logo" class="logo-img" />
      <span class="logo-text">QuestFrontiers | 求索映界</span>
    </button>

    <!-- Navigation -->
    <nav>
      <ul class="nav-icons">
        <li><button class="nav-item">◎ 前沿疆域</button></li>
        <li><button class="nav-item">◉ 映照引擎</button></li>
        <li><button class="nav-item">⬡ 解决方案</button></li>
      </ul>
    </nav>

    <!-- Toggle -->
    <button class="explorer-toggle" id="toggleBtn">
      <span>探索者模式</span>
      <span class="toggle-switch"><span class="toggle-dot"></span></span>
    </button>

  </div>
</header>

<!-- ================= MAIN ================= -->
<main>

  <!-- Hero Section -->
  <section class="hero">
    <div id="three-container"></div>

    <!-- fallback -->
    <noscript>请开启 JavaScript 以体验 3D 内容</noscript>

    <div class="energy-core"></div>

    <div class="hero-center">
      <h1>QuestFrontiers</h1>
      <p>探索智能 · 映照万象</p>
    </div>
  </section>

</main>

<!-- ================= PANEL ================= -->
<aside id="node-panel" hidden>
  <h3 id="node-title">AI Node</h3>
  <p id="node-desc">系统就绪</p>
  <button id="closePanelBtn">关闭</button>
</aside>

</body>
</html>
